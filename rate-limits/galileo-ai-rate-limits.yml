description: >-
  Galileo applies per-API-key rate limits and per-tier monthly trace/evaluation quotas. Specific RPS
  thresholds are not publicly documented on the docs landing page; the API returns 429 on overage.
  Coordinate with Galileo support for higher limits.
notes: Per-tier monthly quotas; specific RPS not publicly documented.
