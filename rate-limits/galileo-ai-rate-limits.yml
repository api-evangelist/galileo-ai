  throttled: 429
limits:
- name: Per API key
  scope: account
  metric: requests
  limit: see provider documentation
  notes: Throttled with 429 on overage.
- name: Monthly quota
  scope: account
  metric: traces+evals
  limit: tier-defined
  notes: Each plan tier has a monthly trace/eval allowance.
policies:
- name: Backoff Strategy
  description: Honor 429/Retry-After with exponential backoff.
- name: Sampling
  description: Sample traces in production to stay within tier quota.
