description: >-
  Galileo offers a free Developer tier (limited monthly usage) and paid tiers (Starter, Pro,
  Enterprise) with seat-based and usage-based pricing. Exact pricing for Pro and Enterprise is sales-
  led. The platform is sold per-environment with metered usage on traces and evaluations.
notes: Free Developer tier + paid Starter/Pro/Enterprise. Exact paid pricing is contact-sales.
