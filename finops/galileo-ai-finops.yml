specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Galileo
providerId: galileo-ai
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- AI Evaluation
- Observability
- GenAI
- Guardrails
- Agentic AI
- LLM
- FinOps
- Cost Management
- FOCUS
description: >-
  FOCUS-aligned FinOps profile for Galileo. Cost is driven by tier (seats) plus metered
  traces/evaluations. Optimize by using sampling in high-volume production paths, choosing cheaper
  judge models within Galileo evaluators, and aligning tier with actual usage at renewal.
notes: Seat + metered traces/evals; sampling and judge-model choice are key levers.
sources:
- https://galileo.ai/pricing
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Galileo
serviceCategory: AI Observability
billingModel:
  pricingCategory: Subscription + Usage
  billingFrequency: Monthly / Annual
  billingCurrency: USD
  chargeCategories:
  - Subscription
  - Usage
focusColumns:
  ServiceName: Galileo
  ServiceCategory: AI Observability
  ProviderName: Galileo
  PublisherName: Galileo
  InvoiceIssuerName: Galileo
  BillingCurrency: USD
  ChargeCategory: Subscription
meters:
- name: seats
  description: Active users with platform access.
  unit: seat-month
  aggregation: max
  dimensions:
  - team
- name: traces
  description: Traces ingested into Galileo.
  unit: trace
  aggregation: sum
  dimensions:
  - project
- name: evaluations
  description: Evaluation runs executed.
  unit: eval
  aggregation: sum
  dimensions:
  - project
principles:
- name: Visibility
  description: Track trace and eval volume per project monthly.
- name: Allocation
  description: Allocate cost per AI feature or model team.
- name: Optimization
  description: Sample traces in production; pick cheaper judge models in evaluators.
- name: Accountability
  description: AI/ML platform team owns Galileo contract and tier.
maintainers:
