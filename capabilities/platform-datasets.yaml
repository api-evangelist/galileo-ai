naftiko: 1.0.0-alpha2
info:
  label: Galileo Public API — Datasets
  description: 'Galileo Public API — Datasets. Self-contained Naftiko capability for managing
    Galileo datasets, dataset content, querying, and downloads.'
  tags:
  - Galileo
  - Datasets
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    GALILEO_API_KEY: GALILEO_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-datasets
    baseUri: https://api.galileo.ai
    description: Galileo Datasets business capability. Self-contained, no shared references.
    resources:
    - name: datasets
      path: /v2/datasets
      operations:
      - name: listdatasets
        method: GET
        description: List Galileo datasets.
      - name: createdataset
        method: POST
        description: Create a Galileo dataset.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: dataset
      path: /v2/datasets/{dataset_id}
      operations:
      - name: getdataset
        method: GET
        description: Get a Galileo dataset.
        inputParameters:
        - name: dataset_id
          in: path
          type: string
          required: true
      - name: updatedataset
        method: PATCH
        description: Update a Galileo dataset.
        inputParameters:
        - name: dataset_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: deletedataset
        method: DELETE
        description: Delete a Galileo dataset.
        inputParameters:
        - name: dataset_id
          in: path
          type: string
          required: true
    - name: datasetcontent
      path: /v2/datasets/{dataset_id}/content
      operations:
      - name: getdatasetcontent
        method: GET
        description: Get the content rows for a Galileo dataset.
        inputParameters:
        - name: dataset_id
          in: path
          type: string
          required: true
      - name: replacedatasetcontent
        method: PUT
        description: Replace the content rows of a Galileo dataset.
        inputParameters:
        - name: dataset_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: patchdatasetcontent
        method: PATCH
        description: Patch (incremental update) the content rows of a Galileo dataset.
        inputParameters:
        - name: dataset_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
    - name: datasetquery
      path: /v2/datasets/{dataset_id}/content/query
      operations:
      - name: querydatasetcontent
        method: POST
        description: Query the content of a Galileo dataset.
        inputParameters:
        - name: dataset_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
    - name: datasetdownload
      path: /v2/datasets/{dataset_id}/download
      operations:
      - name: downloaddataset
        method: GET
        description: Download a Galileo dataset.
        inputParameters:
        - name: dataset_id
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Galileo-API-Key
      value: '{{env.GALILEO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: platform-datasets-rest
    port: 8080
    description: REST adapter for Galileo Datasets.
    resources:
    - path: /v1/datasets
      name: datasets
      operations:
      - method: GET
        name: listdatasets
        call: platform-datasets.listdatasets
      - method: POST
        name: createdataset
        call: platform-datasets.createdataset
        with:
          body: rest.body
    - path: /v1/datasets/{dataset_id}
      name: dataset
      operations:
      - method: GET
        name: getdataset
        call: platform-datasets.getdataset
        with:
          dataset_id: rest.path.dataset_id
      - method: PATCH
        name: updatedataset
        call: platform-datasets.updatedataset
        with:
          dataset_id: rest.path.dataset_id
          body: rest.body
      - method: DELETE
        name: deletedataset
        call: platform-datasets.deletedataset
        with:
          dataset_id: rest.path.dataset_id
  - type: mcp
    namespace: platform-datasets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Galileo Datasets.
    tools:
    - name: galileo-list-datasets
      description: List Galileo datasets.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-datasets.listdatasets
    - name: galileo-create-dataset
      description: Create a Galileo dataset.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-datasets.createdataset
      with:
        body: tools.body
    - name: galileo-query-dataset
      description: Query content rows in a Galileo dataset.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-datasets.querydatasetcontent
      with:
        dataset_id: tools.dataset_id
        body: tools.body
