naftiko: 1.0.0-alpha2
info:
  label: Galileo Public API — Projects
  description: 'Galileo Public API — Projects. Self-contained Naftiko capability covering the projects
    business surface (list, create, read, update, delete projects in Galileo).'
  tags:
  - Galileo
  - Projects
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    GALILEO_API_KEY: GALILEO_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-projects
    baseUri: https://api.galileo.ai
    description: Galileo Projects business capability. Self-contained, no shared references.
    resources:
    - name: projects
      path: /v2/projects
      operations:
      - name: listprojects
        method: GET
        description: List Galileo projects.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createproject
        method: POST
        description: Create a Galileo project.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Project create payload.
          required: true
    - name: project
      path: /v2/projects/{project_id}
      operations:
      - name: getproject
        method: GET
        description: Get a Galileo project by id.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project_id
          in: path
          type: string
          required: true
      - name: updateproject
        method: PATCH
        description: Update a Galileo project.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: deleteproject
        method: DELETE
        description: Delete a Galileo project.
        inputParameters:
        - name: project_id
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Galileo-API-Key
      value: '{{env.GALILEO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: platform-projects-rest
    port: 8080
    description: REST adapter for Galileo Projects. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/projects
      name: projects
      description: REST surface for Galileo projects.
      operations:
      - method: GET
        name: listprojects
        description: List Galileo projects.
        call: platform-projects.listprojects
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createproject
        description: Create a Galileo project.
        call: platform-projects.createproject
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{project_id}
      name: project
      description: REST surface for a single Galileo project.
      operations:
      - method: GET
        name: getproject
        description: Get a Galileo project.
        call: platform-projects.getproject
        with:
          project_id: rest.path.project_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateproject
        description: Update a Galileo project.
        call: platform-projects.updateproject
        with:
          project_id: rest.path.project_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteproject
        description: Delete a Galileo project.
        call: platform-projects.deleteproject
        with:
          project_id: rest.path.project_id
  - type: mcp
    namespace: platform-projects-mcp
    port: 9090
    transport: http
    description: MCP adapter for Galileo Projects.
    tools:
    - name: galileo-list-projects
      description: List Galileo projects.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-projects.listprojects
      outputParameters:
      - type: object
        mapping: $.
    - name: galileo-create-project
      description: Create a Galileo project.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-projects.createproject
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: galileo-get-project
      description: Get a Galileo project by id.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-projects.getproject
      with:
        project_id: tools.project_id
      outputParameters:
      - type: object
        mapping: $.
    - name: galileo-update-project
      description: Update a Galileo project.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-projects.updateproject
      with:
        project_id: tools.project_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: galileo-delete-project
      description: Delete a Galileo project.
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: platform-projects.deleteproject
      with:
        project_id: tools.project_id
